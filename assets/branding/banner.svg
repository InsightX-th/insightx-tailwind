<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03122e"/>
      <stop offset="0.55" stop-color="#062a6b"/>
      <stop offset="1" stop-color="#0a4fbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0079ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>
  <g stroke="#7dd3fc" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 420 C 300 360, 520 470, 860 400 S 1360 300, 1544 360" fill="none"/>
    <path d="M0 450 C 320 400, 560 500, 900 430 S 1380 340, 1544 400" fill="none"/>
  </g>

  <!-- Wordmark (bottom-left stays clear: WordPress overlays the plugin name there) -->
  <text x="110" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">InsightX Tailwind</text>
  <text x="114" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#bae6fd">Tailwind CSS 4.3 for WordPress</text>


  <!-- Editor card -->
  <g transform="translate(1010 78)">
    <rect width="420" height="300" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="36" cy="34" r="7" fill="#f87171"/><circle cx="60" cy="34" r="7" fill="#fbbf24"/><circle cx="84" cy="34" r="7" fill="#34d399"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">
      <text x="34" y="96" fill="#c4b5fd">&lt;section</text>
      <text x="54" y="134" fill="#7dd3fc">class=<tspan fill="#fde68a">"p-6 md:flex</tspan></text>
      <text x="54" y="170" fill="#fde68a">gap-8 rounded-2xl</text>
      <text x="54" y="206" fill="#fde68a">bg-white shadow-lg"</text>
      <text x="34" y="244" fill="#c4b5fd">&gt;</text>
    </g>
    <rect x="34" y="262" width="150" height="10" rx="5" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="196" y="262" width="96" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Tailwind-style logo badge -->
  <g transform="translate(900 268)">
    <rect width="150" height="150" rx="36" fill="url(#logo)"/>
    <g transform="translate(23 23) scale(4.4)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6c-2.67 0-4.33 1.33-5 4 1-1.33 2.17-1.83 3.5-1.5.76.19 1.31.74 1.91 1.35C13.39 10.84 14.53 12 17 12c2.67 0 4.33-1.33 5-4-1 1.33-2.17 1.83-3.5 1.5-.76-.19-1.31-.74-1.91-1.35C15.61 7.16 14.47 6 12 6Z"/>
      <path d="M7 12c-2.67 0-4.33 1.33-5 4 1-1.33 2.17-1.83 3.5-1.5.76.19 1.31.74 1.91 1.35C8.39 16.84 9.53 18 12 18c2.67 0 4.33-1.33 5-4-1 1.33-2.17 1.83-3.5 1.5-.76-.19-1.31-.74-1.91-1.35C10.61 13.16 9.47 12 7 12Z"/>
    </g>
  </g>
</svg>
